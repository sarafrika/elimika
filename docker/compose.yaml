networks:
  sarafrika:
    external: true

volumes:
  elimika_storage:
    driver: local
  elimika_logs:
    driver: local
  meili_data:
    driver: local

services:
  elimika:
    image: sarafrika/elimika:latest
    restart: unless-stopped
    # The JVM sizes its heap as a percentage of this limit (see the ENTRYPOINT in ../Dockerfile).
    # Without a limit it would size against the whole host, so these two settings only make sense
    # together — changing one without the other silently breaks the sizing.
    #
    # 1.5g against ~690MiB observed steady-state gives room for load and for metaspace to settle,
    # while leaving the rest of the 5.8GiB host to Keycloak, Postgres and the other services, which
    # are managed outside this file and are still unlimited. Revisit from load testing, not from
    # idle usage, before this is treated as a production figure.
    mem_limit: 1536m
    mem_reservation: 768m
    env_file:
      - .env
    environment:
      SERVER_PORT: 30000
    ports:
      - "30000:30000"
    networks:
      - sarafrika
    volumes:
      - elimika_storage:/app/storage
      - elimika_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Search engine for the search module. Holds disposable projections of PostgreSQL only - losing the
  # volume costs a rebuild (POST /api/v1/admin/search/rebuild), not data.
  #
  # No published port: the API reaches it over the sarafrika network as http://meilisearch:7700, and
  # nothing outside the host should. The image tag is pinned exactly; a Meilisearch upgrade can change
  # the on-disk format, so move it deliberately and rebuild the indexes afterwards.
  #
  # elimika deliberately has no depends_on on this service: search is optional (SEARCH_ENABLED), the
  # API starts and serves from PostgreSQL without it, and a depends_on would make every API deploy
  # wait on - or fail with - a service it does not need.
  meilisearch:
    image: getmeili/meilisearch:v1.54.1
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    # The master key is kept out of .env so the API container never receives it.
    env_file:
      - meilisearch.env
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 256Mb
    networks:
      - sarafrika
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
