<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email(${approved} ? 'Account approved' : 'Application review',
                    ${approved} ? ${'Your ' + domainLabel + ' dashboard is now open. Sign in to get started.'} : 'See the reviewer’s note and how to send your application again.',
                    ${approved} ? 'Approved' : 'Application review', ${approved} ? 'green' : 'slate',
                    ~{::hero}, ~{::content}, ${'You’re receiving this because you applied for ' + domainLabel + ' access on Elimika.'})}">
<body>
<th:block th:fragment="hero">
    <th:block th:if="${approved}">
        <h1 th:replace="~{email/fragments/layout :: h1(${'You’re approved, ' + fmt.firstName(recipientName)})}"></h1>
        <p th:replace="~{email/fragments/layout :: lead(${'Our team reviewed your ' + domainLabel + ' profile and approved it. Your ' + domainLabel + ' dashboard is unlocked.'})}"></p>
    </th:block>
    <th:block th:unless="${approved}">
        <h1 th:replace="~{email/fragments/layout :: h1(${'We couldn’t approve your ' + domainLabel + ' access yet'})}"></h1>
        <p th:replace="~{email/fragments/layout :: lead(${'Thanks for applying, ' + fmt.firstName(recipientName) + '. Our team needs a few changes before your profile can be approved. Nothing else on your account has changed.'})}"></p>
    </th:block>
</th:block>
<th:block th:fragment="content">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;border:1px solid #E4E9F2;border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden;">
        <tr th:replace="~{email/fragments/layout :: factHead('Review outcome')}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Role', ${fmt.capitalize(domainLabel)})}"></tr>
        <tr th:replace="~{email/fragments/layout :: factChip('Status', ${approved} ? 'Approved' : 'Changes needed', ${approved} ? 'green' : 'slate')}"></tr>
    </table>

    <th:block th:if="${fmt.has(reviewNotes)}">
        <table th:replace="~{email/fragments/layout :: note(${approved} ? 'Note from the reviewer' : 'What the reviewer needs', ${reviewNotes})}"></table>
    </th:block>

    <th:block th:unless="${approved}">
        <p th:replace="~{email/fragments/layout :: label('How to apply again')}"></p>
        <table th:replace="~{email/fragments/layout :: step('1', 'Update your profile', 'Make the changes the reviewer asked for.', false)}"></table>
        <table th:replace="~{email/fragments/layout :: step('2', 'Submit it for review', 'We’ll email you as soon as a decision is made.', false)}"></table>
    </th:block>

    <table th:replace="~{email/fragments/layout :: button(${frontendUrl + actionPath}, ${approved} ? 'Sign in to Elimika' : 'Update my profile')}"></table>

    <p style="margin:0;font-size:14px;line-height:1.6;color:#5B6474;">
        <span th:text="${approved} ? 'Questions about getting started?' : 'Think this was a mistake?'">Questions?</span>
        Write to <a th:href="${'mailto:' + supportEmail}" style="color:#0061ED;font-weight:600;" th:text="${supportEmail}">support</a>.
    </p>
</th:block>
</body>
</html>
