<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email('Applicant withdrew',
                    ${instructorName + ' withdrew their application. Your class job is still open.'},
                    'Class jobs', 'slate', ~{::hero}, ~{::content},
                    'You’re receiving this because you manage class jobs for your organisation on Elimika.')}">
<body>
<th:block th:fragment="hero">
    <h1 th:replace="~{email/fragments/layout :: h1('An applicant withdrew')}"></h1>
    <p th:replace="~{email/fragments/layout :: lead(${'Hi ' + fmt.firstName(recipientName) + ', ' + instructorName + ' withdrew their application for your ' + contextName + ' class job.'})}"></p>
</th:block>
<th:block th:fragment="content">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;border:1px solid #E4E9F2;border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden;">
        <tr th:replace="~{email/fragments/layout :: factHead('Application')}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Applicant', ${instructorName})}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Class job', ${contextName})}"></tr>
        <tr th:replace="~{email/fragments/layout :: factChip('Status', 'Withdrawn', 'slate')}"></tr>
    </table>

    <th:block th:if="${fmt.has(reviewNotes)}">
        <table th:replace="~{email/fragments/layout :: note('Their reason', ${reviewNotes})}"></table>
    </th:block>

    <p th:replace="~{email/fragments/layout :: para('Your class job stays open, so you can review the other applicants or invite someone else.')}"></p>

    <table th:replace="~{email/fragments/layout :: button(${frontendUrl + '/dashboard/organisation/jobs'}, 'Review other applicants')}"></table>
</th:block>
</body>
</html>
