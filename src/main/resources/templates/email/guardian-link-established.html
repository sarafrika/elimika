<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email('Accounts linked',
                    ${'Your accounts are linked. Follow ' + studentName + '’s learning from your parent dashboard.'},
                    'Accounts linked', 'violet', ~{::hero}, ~{::content},
                    'You’re receiving this because you’re linked to a learner as their parent or guardian.')}">
<body>
<th:block th:fragment="hero">
    <h1 th:replace="~{email/fragments/layout :: h1(${'You’re now linked to ' + studentName})}"></h1>
    <p th:replace="~{email/fragments/layout :: lead(${'Hi ' + guardianName + ', you’re set up as ' + studentName + '’s ' + #strings.toLowerCase(relationshipLabel) + '. You can follow their classes, grades and attendance from your parent dashboard.'})}"></p>
</th:block>
<th:block th:fragment="content">
    <p th:replace="~{email/fragments/layout :: label('What you’ll hear from us')}"></p>
    <table th:replace="~{email/fragments/layout :: step('1', 'Grades and feedback', 'When an instructor marks their work.', false)}"></table>
    <table th:replace="~{email/fragments/layout :: step('2', 'Approval requests', 'When an organisation wants them to join.', false)}"></table>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:10px 0 26px;border:1px solid #E4E9F2;border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden;">
        <tr th:replace="~{email/fragments/layout :: factHead('Link details')}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Learner', ${studentName})}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Your relationship', ${fmt.capitalize(relationshipLabel)})}"></tr>
    </table>

    <table th:replace="~{email/fragments/layout :: button(${actionLink}, 'Open parent dashboard')}"></table>

    <p style="margin:0;font-size:14px;line-height:1.6;color:#5B6474;">
        Didn’t expect this link? Write to
        <a th:href="${'mailto:' + supportEmail}" style="color:#0061ED;font-weight:600;" th:text="${supportEmail}">support</a>
        and we’ll remove it.
    </p>
</th:block>
</body>
</html>
