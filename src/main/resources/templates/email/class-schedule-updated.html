<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email('Schedule change',
                    ${fmt.has(dueAt) ? assessmentTitle + ' is now due ' + fmt.dateTime(dueAt) + '.' : assessmentTitle + ' was ' + changeTypeLabel + '.'},
                    'Schedule change', 'blue', ~{::hero}, ~{::content},
                    'You’re receiving this because you teach the class this assessment belongs to.')}">
<body>
<th:block th:fragment="hero">
    <h1 th:replace="~{email/fragments/layout :: h1(${'An assessment was ' + changeTypeLabel})}"></h1>
    <p th:replace="~{email/fragments/layout :: lead(${'Hi ' + fmt.firstName(recipientName) + ', the schedule for ' + assessmentTitle + ' has changed. Reminders to learners now follow the updated dates.'})}"></p>
</th:block>
<th:block th:fragment="content">
    <th:block th:if="${fmt.has(dueAt)}">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;">
            <tr>
                <td style="padding:16px 18px;border:2px solid #0061ED;border-radius:14px;background:#F3F7FF;">
                    <p style="margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#0047B3;">Now due</p>
                    <p style="margin:0;font-size:18px;font-weight:800;color:#0B1736;" th:text="${fmt.dateTime(dueAt)}">Due</p>
                </td>
            </tr>
        </table>
    </th:block>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;border:1px solid #E4E9F2;border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden;">
        <tr th:replace="~{email/fragments/layout :: factHead('Schedule details')}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Assessment', ${assessmentTitle})}"></tr>
        <th:block th:if="${fmt.has(assessmentType)}"><tr th:replace="~{email/fragments/layout :: fact('Type', ${fmt.capitalize(#strings.toLowerCase(assessmentType))})}"></tr></th:block>
        <th:block th:if="${fmt.has(visibleAt)}"><tr th:replace="~{email/fragments/layout :: fact('Visible to learners', ${fmt.dateTime(visibleAt)})}"></tr></th:block>
        <th:block th:if="${fmt.has(releaseStrategy)}"><tr th:replace="~{email/fragments/layout :: fact('Release', ${fmt.capitalize(#strings.replace(#strings.toLowerCase(releaseStrategy), '_', ' '))})}"></tr></th:block>
        <th:block th:if="${fmt.has(changedBy)}"><tr th:replace="~{email/fragments/layout :: fact('Changed by', ${changedBy})}"></tr></th:block>
        <th:block th:if="${fmt.has(changedAt)}"><tr th:replace="~{email/fragments/layout :: fact('Changed', ${fmt.dateTime(changedAt)})}"></tr></th:block>
    </table>

    <th:block th:if="${fmt.has(notes)}">
        <table th:replace="~{email/fragments/layout :: note('Note', ${notes})}"></table>
    </th:block>

    <table th:replace="~{email/fragments/layout :: button(${frontendUrl + '/dashboard/instructor/assessment'}, 'Review the schedule')}"></table>

    <p style="margin:0;font-size:14px;line-height:1.6;color:#5B6474;">
        Didn’t expect this change? Write to
        <a th:href="${'mailto:' + supportEmail}" style="color:#0061ED;font-weight:600;" th:text="${supportEmail}">support</a>.
    </p>
</th:block>
</body>
</html>
