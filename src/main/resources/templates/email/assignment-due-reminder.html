<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email('Assignment due',
                    ${courseName + (fmt.has(dueDate) ? ' · due ' + fmt.dateTime(dueDate) : '')},
                    'Due soon', 'amber', ~{::hero}, ~{::content},
                    ${'You’re receiving this because you’re enrolled in ' + courseName + '.'})}">
<body>
<th:block th:fragment="hero">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td width="112" style="vertical-align:middle;padding-right:22px;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                    <tr>
                        <td align="center" width="104" height="104"
                            th:style="'width:104px;height:104px;border-radius:20px;text-align:center;vertical-align:middle;background:' + ((${isUrgent != null and isUrgent} or ${daysUntilDue != null and daysUntilDue <= 1}) ? '#B42318' : '#B4540A') + ';'">
                            <th:block th:if="${daysUntilDue != null and daysUntilDue > 0}">
                                <div style="font-size:42px;line-height:1;font-weight:800;color:#FFFFFF;" th:text="${daysUntilDue}">2</div>
                                <div style="margin-top:4px;font-size:13px;font-weight:700;color:#FFFFFF;" th:text="${daysUntilDue == 1} ? 'day left' : 'days left'">days left</div>
                            </th:block>
                            <div th:unless="${daysUntilDue != null and daysUntilDue > 0}" style="font-size:20px;line-height:1.2;font-weight:800;color:#FFFFFF;">Due<br>today</div>
                        </td>
                    </tr>
                </table>
            </td>
            <td style="vertical-align:middle;">
                <p th:replace="~{email/fragments/layout :: eyebrow(${'Hi ' + fmt.firstName(recipientName) + ', this is due soon'}, 'amber')}"></p>
                <h1 th:replace="~{email/fragments/layout :: h1(${assignmentTitle})}"></h1>
                <p style="margin:8px 0 0;font-size:14px;color:#5B6474;" th:text="${courseName}">Course</p>
            </td>
        </tr>
    </table>
</th:block>
<th:block th:fragment="content">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;border:1px solid #E4E9F2;border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden;">
        <tr th:replace="~{email/fragments/layout :: factHead('Assignment')}"></tr>
        <th:block th:if="${fmt.has(dueDate)}"><tr th:replace="~{email/fragments/layout :: fact('Due', ${fmt.dateTime(dueDate)})}"></tr></th:block>
        <tr th:replace="~{email/fragments/layout :: fact('Course', ${courseName})}"></tr>
        <tr th:replace="~{email/fragments/layout :: factChip('Your status', 'Not submitted', 'amber')}"></tr>
    </table>

    <table th:replace="~{email/fragments/layout :: button(${frontendUrl + '/dashboard/student/assessment/assignments'}, 'Submit assignment')}"></table>

    <p th:replace="~{email/fragments/layout :: small('Late work may lose marks. If you need more time, message your instructor from the class page before the deadline.')}"></p>
</th:block>
</body>
</html>
