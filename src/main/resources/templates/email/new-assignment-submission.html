<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email('Submission to grade',
                    ${(isLate != null and isLate ? 'Submitted after the deadline' : 'Submitted on time') + (hasAttachments != null and hasAttachments ? ' · with attachments' : '') + ' · ready to grade.'},
                    'To grade', 'blue', ~{::hero}, ~{::content},
                    ${'You’re receiving this because you teach ' + courseName + '.'})}">
<body>
<th:block th:fragment="hero">
    <h1 th:replace="~{email/fragments/layout :: h1(${'Work to review, ' + fmt.firstName(recipientName)})}"></h1>
    <p th:replace="~{email/fragments/layout :: lead(${studentName + ' submitted ' + assignmentTitle + ' in ' + courseName + '.'})}"></p>
</th:block>
<th:block th:fragment="content">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;border:1px solid #E4E9F2;border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden;">
        <tr>
            <td style="padding:16px 18px;">
                <p style="margin:0 0 2px;font-size:15px;font-weight:700;color:#0B1736;" th:text="${studentName}">Student</p>
                <p style="margin:0;font-size:13px;color:#5B6474;"
                   th:text="${fmt.has(submittedAt) ? 'Submitted ' + fmt.dateTime(submittedAt) : studentEmail}">Submitted</p>
            </td>
            <td align="right" style="padding:16px 18px;vertical-align:middle;">
                <span th:style="'display:inline-block;font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;' + (${isLate != null and isLate} ? 'color:#8A3F06;background:#FFF1DC;' : 'color:#0B6B45;background:#E8F6EF;')"
                      th:text="${isLate != null and isLate} ? 'Late' : 'On time'">On time</span>
            </td>
        </tr>
        <tr th:if="${fmt.has(submissionText)}">
            <td colspan="2" style="padding:16px 18px;border-top:1px solid #EEF1F6;">
                <p style="margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#5B6474;">Student’s note</p>
                <p style="margin:0;font-size:15px;line-height:1.6;color:#344054;white-space:pre-line;" th:text="${submissionText}">Text</p>
            </td>
        </tr>
        <tr th:if="${hasAttachments != null and hasAttachments and fmt.has(attachmentFileNames)}">
            <td colspan="2" style="padding:16px 18px;border-top:1px solid #EEF1F6;">
                <p style="margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#5B6474;"
                   th:text="${'Attachments · ' + #lists.size(attachmentFileNames)}">Attachments</p>
                <span th:each="fileName : ${attachmentFileNames}"
                      style="display:inline-block;margin:0 8px 8px 0;padding:8px 12px;font-size:13px;font-weight:600;color:#0B1736;background:#F7F9FC;border:1px solid #E4E9F2;border-radius:10px;"
                      th:text="${fileName}">file</span>
            </td>
        </tr>
        <th:block th:if="${fmt.has(dueDate)}"><tr th:replace="~{email/fragments/layout :: fact('Due', ${fmt.dateTime(dueDate)})}"></tr></th:block>
    </table>

    <table th:replace="~{email/fragments/layout :: button(${frontendUrl + '/dashboard/instructor/assignment'}, 'Review and grade')}"></table>
</th:block>
</body>
</html>
