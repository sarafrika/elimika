<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email('Hire blocked',
                    ${clashCount + (clashCount == 1 ? ' session overlaps' : ' sessions overlap') + ' with classes you already teach. Nothing has changed yet.'},
                    'Action needed', 'amber', ~{::hero}, ~{::content},
                    'You’re receiving this because you applied for a class job on Elimika.')}">
<body>
<th:block th:fragment="hero">
    <h1 th:replace="~{email/fragments/layout :: h1('Your timetable blocked this hire')}"></h1>
    <p th:replace="~{email/fragments/layout :: lead(${'Hi ' + fmt.firstName(recipientName) + ', ' + organisationName + ' tried to hire you for ' + contextName + ', but some of its sessions overlap with classes you already teach.'})}"></p>
</th:block>
<th:block th:fragment="content">
    <p th:replace="~{email/fragments/layout :: label(${'Clashing sessions · ' + clashCount})}"></p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;border:1px solid #F5D9B5;border-radius:14px;border-collapse:separate;border-spacing:0;background:#FFFCF6;overflow:hidden;">
        <tr>
            <td style="padding:14px 18px;font-size:14px;color:#5B6474;">First clash</td>
            <td align="right" style="padding:14px 18px;font-size:14px;font-weight:700;color:#0B1736;" th:text="${fmt.dateTime(firstClashAt)}">When</td>
        </tr>
        <tr th:each="reason : ${clashReasons}">
            <td colspan="2" style="padding:12px 18px;border-top:1px solid #F5D9B5;font-size:14px;line-height:1.5;color:#344054;" th:text="${reason}">Reason</td>
        </tr>
    </table>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;">
        <tr>
            <td style="padding:16px 18px;border-radius:14px;background:#F7F9FC;font-size:14px;line-height:1.55;color:#344054;">
                Nothing has changed: your application is still open and your other classes are untouched.
            </td>
        </tr>
    </table>

    <p th:replace="~{email/fragments/layout :: label('How to fix it')}"></p>
    <table th:replace="~{email/fragments/layout :: step('1', 'Free up the time', 'Move or hand over the clashing classes, if you can.', false)}"></table>
    <table th:replace="~{email/fragments/layout :: step('2', 'Let the organisation know', 'They can try the hire again, or adjust the class schedule.', false)}"></table>

    <table th:replace="~{email/fragments/layout :: button(${frontendUrl + actionPath}, 'View my applications')}"></table>
</th:block>
</body>
</html>
