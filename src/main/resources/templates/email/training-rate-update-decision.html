<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email('Rate update decision',
                    ${approved} ? ${'Your updated rate for ' + contextName + ' applies from now on.'} : ${'Your rate for ' + contextName + ' stays as it was. See the reviewer’s note.'},
                    ${approved} ? 'Rate approved' : 'Rate not approved', ${approved} ? 'green' : 'slate',
                    ~{::hero}, ~{::content},
                    'You’re receiving this because you asked to change a training rate on Elimika.')}">
<body>
<th:block th:fragment="hero">
    <h1 th:replace="~{email/fragments/layout :: h1(${approved} ? 'Your updated rate is approved' : 'Your rate change was not approved')}"></h1>
    <p th:replace="~{email/fragments/layout :: lead(${'Hi ' + fmt.firstName(recipientName) + ', ' + (approved
        ? 'your updated rate for training ' + contextName + ' was approved and applies from now on.'
        : 'your requested rate for training ' + contextName + ' was not approved, so your current rate stays in place.')})}"></p>
</th:block>
<th:block th:fragment="content">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;border:1px solid #E4E9F2;border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden;">
        <tr th:replace="~{email/fragments/layout :: factHead('Rate update')}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact(${fmt.capitalize(contextType)}, ${contextName})}"></tr>
        <tr th:replace="~{email/fragments/layout :: factChip('Decision', ${fmt.capitalize(decisionLabel)}, ${approved} ? 'green' : 'slate')}"></tr>
    </table>

    <th:block th:if="${fmt.has(reviewNotes)}">
        <table th:replace="~{email/fragments/layout :: note('Note from the reviewer', ${reviewNotes})}"></table>
    </th:block>

    <table th:replace="~{email/fragments/layout :: button(${frontendUrl + actionPath}, 'View my rates')}"></table>
</th:block>
</body>
</html>
