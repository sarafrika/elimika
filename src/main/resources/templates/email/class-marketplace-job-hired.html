<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email('Hired',
                    ${'You’ve been hired to train ' + contextName + '. The class is now yours to teach.'},
                    'Hired', 'green', ~{::hero}, ~{::content},
                    'You’re receiving this because you applied for a class job on Elimika.')}">
<body>
<th:block th:fragment="hero">
    <h1 th:replace="~{email/fragments/layout :: h1(${'Congratulations, ' + fmt.firstName(recipientName) + '. You’re hired!'})}"></h1>
    <p th:replace="~{email/fragments/layout :: lead(${'You’ve been hired to train ' + contextName + '. The class is now yours to teach.'})}"></p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:20px 0 0;">
        <tr>
            <td th:each="name, it : ${ {'Applied', 'Shortlisted', 'Interview', 'Offer', 'Hired'} }" width="20%" style="padding:0 3px;vertical-align:top;">
                <div style="height:8px;border-radius:999px;background:#0E7A4F;"></div>
                <p th:style="'margin:8px 0 0;font-size:12px;color:#0B1736;font-weight:' + (${it.last} ? '800' : '600') + ';'" th:text="${name}">Step</p>
            </td>
        </tr>
    </table>
</th:block>
<th:block th:fragment="content">
    <th:block th:if="${fmt.has(reviewNotes)}">
        <table th:replace="~{email/fragments/layout :: note('Note from the organisation', ${reviewNotes})}"></table>
    </th:block>

    <p th:replace="~{email/fragments/layout :: label('Get ready to teach')}"></p>
    <table th:replace="~{email/fragments/layout :: step('1', 'Read the course outline', 'See every lesson, assessment and how grades are weighted.', true)}"></table>
    <table th:replace="~{email/fragments/layout :: step('2', 'Check your timetable', 'Your sessions are on your calendar as soon as they’re scheduled.', false)}"></table>
    <table th:replace="~{email/fragments/layout :: step('3', 'Meet your class', 'Your class list and attendance register are ready.', false)}"></table>

    <table th:replace="~{email/fragments/layout :: button(${frontendUrl + '/dashboard/instructor/opportunities/hired'}, 'Open my classes')}"></table>
</th:block>
</body>
</html>
