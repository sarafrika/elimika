<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email('Application update',
                    ${'Your application to train ' + contextName + ' ' + statusLabel + '.'},
                    'Application update', 'slate', ~{::hero}, ~{::content},
                    'You’re receiving this because you applied to train on Elimika.')}">
<body>
<th:block th:fragment="hero">
    <h1 th:replace="~{email/fragments/layout :: h1('An update on your application')}"></h1>
    <p th:replace="~{email/fragments/layout :: lead(${'Hi ' + fmt.firstName(recipientName) + ', your application to train ' + contextName + ' ' + statusLabel + '. Thank you for applying.'})}"></p>
</th:block>
<th:block th:fragment="content">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;border:1px solid #E4E9F2;border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden;">
        <tr th:replace="~{email/fragments/layout :: factHead('Application')}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact(${contextType == 'class' ? 'Class job' : fmt.capitalize(contextType)}, ${contextName})}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Outcome', ${fmt.capitalize(statusLabel)})}"></tr>
    </table>

    <th:block th:if="${fmt.has(reviewNotes)}">
        <table th:replace="~{email/fragments/layout :: note('Note from the reviewer', ${reviewNotes})}"></table>
    </th:block>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;">
        <tr>
            <td style="padding:18px 20px;border:1px solid #E4E9F2;border-radius:14px;">
                <p style="margin:0 0 6px;font-size:15px;font-weight:700;color:#0B1736;">Keep going</p>
                <p style="margin:0;font-size:14px;line-height:1.6;color:#5B6474;">New class jobs and training opportunities are posted regularly. Keep your profile and availability up to date so organisations can find you.</p>
            </td>
        </tr>
    </table>

    <table th:replace="~{email/fragments/layout :: button(${frontendUrl + '/dashboard/instructor/opportunities'}, 'Browse opportunities')}"></table>

    <p style="margin:0;font-size:14px;line-height:1.6;color:#5B6474;">
        Questions about this decision? Write to
        <a th:href="${'mailto:' + supportEmail}" style="color:#0061ED;font-weight:600;" th:text="${supportEmail}">support</a>.
    </p>
</th:block>
</body>
</html>
