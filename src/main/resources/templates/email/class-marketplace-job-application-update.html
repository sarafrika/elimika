<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email('Application update',
                    ${'Your application to train ' + contextName + ' ' + statusLabel + '.'},
                    'Application update', 'blue', ~{::hero}, ~{::content},
                    'You’re receiving this because you applied for a class job on Elimika.')}">
<body>
<th:block th:fragment="hero">
    <p th:replace="~{email/fragments/layout :: eyebrow(${'Good news, ' + fmt.firstName(recipientName)}, 'blue')}"></p>
    <h1 th:replace="~{email/fragments/layout :: h1(${'Your application ' + statusLabel})}"></h1>
    <p th:replace="~{email/fragments/layout :: lead(${'Here’s where your application to train ' + contextName + ' stands.'})}"></p>
</th:block>
<th:block th:fragment="content"
          th:with="stage=${#strings.contains(statusLabel, 'offer') ? 3 : (#strings.contains(statusLabel, 'interview') ? 2 : (#strings.contains(statusLabel, 'shortlist') ? 1 : 4))}">
    <p th:replace="~{email/fragments/layout :: label('Your application')}"></p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;">
        <tr>
            <td th:each="name, it : ${ {'Applied', 'Shortlisted', 'Interview', 'Offer', 'Hired'} }"
                width="20%" style="padding:0 3px;vertical-align:top;">
                <div th:style="'height:8px;border-radius:999px;background:' + (${it.index <= stage} ? '#0061ED' : '#E4E9F2') + ';'"></div>
                <p th:style="'margin:8px 0 0;font-size:12px;font-weight:' + (${it.index == stage} ? '800' : '600') + ';color:' + (${it.index <= stage} ? '#0B1736' : '#5B6474') + ';'"
                   th:text="${name}">Step</p>
            </td>
        </tr>
    </table>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;border:1px solid #E4E9F2;border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden;">
        <tr th:replace="~{email/fragments/layout :: factHead('Class job')}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact(${fmt.capitalize(contextType)}, ${contextName})}"></tr>
        <th:block th:if="${fmt.has(interviewAt)}"><tr th:replace="~{email/fragments/layout :: fact('Interview', ${fmt.dateTime(interviewAt)})}"></tr></th:block>
    </table>

    <th:block th:if="${fmt.has(reviewNotes)}">
        <table th:replace="~{email/fragments/layout :: note('Note from the organisation', ${reviewNotes})}"></table>
    </th:block>

    <table th:replace="~{email/fragments/layout :: note('What happens next',
        ${stage == 1 ? 'The organisation may contact you to arrange an interview. Keep your availability up to date so they can find a time.'
        : (stage == 2 ? 'Look out for a message from the organisation with the interview details. You can reply from your application page.'
        : (stage == 3 ? 'Review the offer and accept or decline it from your application page. The organisation is waiting on your answer.'
        : 'Your sessions are on your timetable. Look over the course outline before the first class.'))})}"></table>

    <table th:replace="~{email/fragments/layout :: button(${frontendUrl + '/dashboard/instructor/opportunities/my-applications'}, ${stage == 3} ? 'Review offer' : 'View application')}"></table>
</th:block>
</body>
</html>
