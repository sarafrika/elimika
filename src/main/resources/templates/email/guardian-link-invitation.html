<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email('Parent invitation',
                    ${'Accept to follow ' + studentName + '’s classes, grades and attendance.' + (fmt.has(expiresAt) ? ' Link expires ' + fmt.date(expiresAt) + '.' : '')},
                    'For parents', 'violet', ~{::hero}, ~{::content},
                    'You’re receiving this because a learner gave this address as their parent or guardian.')}">
<body>
<th:block th:fragment="hero">
    <h1 th:replace="~{email/fragments/layout :: h1(${studentName + ' added you as their ' + #strings.toLowerCase(relationshipLabel)})}"></h1>
    <p th:replace="~{email/fragments/layout :: lead(${'Hi ' + guardianName + ', ' + studentName + ' named you as their ' + #strings.toLowerCase(relationshipLabel) + ' on Elimika. Accept to link your accounts and follow their learning.'})}"></p>
</th:block>
<th:block th:fragment="content">
    <p th:replace="~{email/fragments/layout :: label('Once linked, you can see')}"></p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;">
        <tr>
            <td class="stack" width="50%" style="padding:0 6px 12px 0;vertical-align:top;">
                <div style="padding:14px 16px;border:1px solid #E4E9F2;border-radius:14px;font-size:14px;font-weight:600;color:#0B1736;">Courses and progress</div>
            </td>
            <td class="stack" width="50%" style="padding:0 0 12px 6px;vertical-align:top;">
                <div style="padding:14px 16px;border:1px solid #E4E9F2;border-radius:14px;font-size:14px;font-weight:600;color:#0B1736;">Grades and feedback</div>
            </td>
        </tr>
        <tr>
            <td class="stack" width="50%" style="padding:0 6px 0 0;vertical-align:top;">
                <div style="padding:14px 16px;border:1px solid #E4E9F2;border-radius:14px;font-size:14px;font-weight:600;color:#0B1736;">Attendance</div>
            </td>
            <td class="stack" width="50%" style="padding:0 0 0 6px;vertical-align:top;">
                <div style="padding:14px 16px;border:1px solid #E4E9F2;border-radius:14px;font-size:14px;font-weight:600;color:#0B1736;">Class timetable</div>
            </td>
        </tr>
    </table>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;border:1px solid #E4E9F2;border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden;">
        <tr th:replace="~{email/fragments/layout :: factHead('Link details')}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Learner', ${studentName})}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Your relationship', ${fmt.capitalize(relationshipLabel)})}"></tr>
        <th:block th:if="${fmt.has(expiresAt)}"><tr th:replace="~{email/fragments/layout :: fact('Link expires', ${fmt.date(expiresAt)})}"></tr></th:block>
    </table>

    <table th:replace="~{email/fragments/layout :: button(${actionLink}, 'Accept and link accounts')}"></table>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td style="padding:16px 18px;border-radius:14px;background:#F7F9FC;font-size:14px;line-height:1.55;color:#344054;">
                You don’t need to register separately; accepting sets up your parent access.
                Not this learner’s parent or guardian? Ignore this email, or tell us at
                <a th:href="${'mailto:' + supportEmail}" style="color:#0061ED;font-weight:600;" th:text="${supportEmail}">support</a>.
            </td>
        </tr>
    </table>
</th:block>
</body>
</html>
