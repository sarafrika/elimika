<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email('Assignment graded',
                    ${(fmt.has(instructorName) ? instructorName : 'Your instructor') + ' marked your work' + (hasFeedback != null and hasFeedback ? ' and left feedback.' : '.')},
                    'Graded', 'green', ~{::hero}, ~{::content},
                    ${'You’re receiving this because you’re enrolled in ' + courseName + '.'})}">
<body>
<th:block th:fragment="hero">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td width="124" style="vertical-align:middle;padding-right:22px;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                    <tr>
                        <td align="center" width="104" height="104"
                            style="width:104px;height:104px;border:8px solid #0E7A4F;border-radius:999px;background:#FFFFFF;text-align:center;vertical-align:middle;">
                            <div style="font-size:28px;line-height:1;font-weight:800;color:#0B1736;" th:text="${percentage} + '%'">85%</div>
                            <div style="margin-top:4px;font-size:13px;font-weight:600;color:#5B6474;" th:text="${score} + ' / ' + ${maxScore}">17 / 20</div>
                        </td>
                    </tr>
                </table>
            </td>
            <td style="vertical-align:middle;">
                <p th:replace="~{email/fragments/layout :: eyebrow(${(gradeLevel == 'excellent' ? 'Great work, ' : (gradeLevel == 'good' ? 'Good work, ' : 'Keep going, ')) + fmt.firstName(recipientName)}, 'green')}"></p>
                <h1 th:replace="~{email/fragments/layout :: h1(${assignmentTitle + ' is graded'})}"></h1>
                <p style="margin:8px 0 0;font-size:14px;color:#5B6474;" th:text="${courseName}">Course</p>
            </td>
        </tr>
    </table>
</th:block>
<th:block th:fragment="content">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;border:1px solid #E4E9F2;border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden;">
        <tr th:replace="~{email/fragments/layout :: factHead('Your result')}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Score', ${score + ' out of ' + maxScore})}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Percentage', ${percentage + '%'})}"></tr>
        <th:block th:if="${fmt.has(instructorName)}"><tr th:replace="~{email/fragments/layout :: fact('Marked by', ${instructorName})}"></tr></th:block>
    </table>

    <th:block th:if="${hasFeedback != null and hasFeedback and fmt.has(instructorComments)}">
        <table th:replace="~{email/fragments/layout :: note(${fmt.has(instructorName) ? 'Feedback from ' + instructorName : 'Feedback from your instructor'}, ${instructorComments})}"></table>
    </th:block>

    <table th:replace="~{email/fragments/layout :: button(${frontendUrl + '/dashboard/student/assessment/assignments'}, 'See my grades')}"></table>
</th:block>
</body>
</html>
