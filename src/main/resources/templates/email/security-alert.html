<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email(${alertTitle}, ${alertMessage}, 'Security alert', 'violet',
                    ~{::hero}, ~{::content},
                    'You’re receiving this because it concerns the security of your Elimika account.')}">
<body>
<th:block th:fragment="hero">
    <h1 th:replace="~{email/fragments/layout :: h1(${alertTitle})}"></h1>
    <p th:replace="~{email/fragments/layout :: lead(${alertMessage})}"></p>
</th:block>
<th:block th:fragment="content">
    <table th:replace="~{email/fragments/layout :: button(${actionLink}, 'Review payout details')}"></table>

    <p style="margin:0;font-size:14px;line-height:1.6;color:#5B6474;">
        Didn’t do this? Change your password and write to
        <a th:href="${'mailto:' + supportEmail}" style="color:#0061ED;font-weight:600;" th:text="${supportEmail}">support</a>
        straight away.
    </p>
</th:block>
</body>
</html>
