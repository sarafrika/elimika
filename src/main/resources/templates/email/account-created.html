<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email('Welcome to Elimika', 'Your account is ready. Set your password and take your first steps.', 'Your account', 'blue', ~{::hero}, ~{::content}, 'You’re receiving this because an Elimika account was created with this address.')}">
<body>
<th:block th:fragment="hero">
    <h1 th:replace="~{email/fragments/layout :: h1(${'Welcome to Elimika, ' + fmt.firstName(recipientName)})}"></h1>
    <p th:replace="~{email/fragments/layout :: lead('Your account is ready. Elimika brings your courses, classes, assignments and progress together in one place, so you always know what to learn next.')}"></p>
</th:block>
<th:block th:fragment="content">
    <p th:replace="~{email/fragments/layout :: label('Get started in three steps')}"></p>
    <table th:replace="~{email/fragments/layout :: step('1', 'Set your password', 'Use the secure link in the separate email we sent you. Already have a password? Just sign in.', true)}"></table>
    <table th:replace="~{email/fragments/layout :: step('2', 'Complete your profile', 'Add your details once; every Elimika role you take on reuses them.', false)}"></table>
    <table th:replace="~{email/fragments/layout :: step('3', 'Find your first course', 'Browse courses and classes near you or online, and enrol in a few taps.', false)}"></table>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:10px 0 26px;border:1px solid #E4E9F2;border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden;">
        <tr th:replace="~{email/fragments/layout :: factHead('Account details')}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Name', ${recipientName})}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Sign-in email', ${recipientEmail})}"></tr>
        <th:block th:if="${fmt.has(createdAt)}"><tr th:replace="~{email/fragments/layout :: fact('Created', ${fmt.dateTime(createdAt)})}"></tr></th:block>
    </table>

    <table th:replace="~{email/fragments/layout :: button(${frontendUrl + '/dashboard'}, 'Open Elimika')}"></table>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td style="padding:16px 18px;border-radius:14px;background:#FFF8EB;font-size:14px;line-height:1.55;color:#344054;">
                Didn’t create this account? Write to
                <a th:href="${'mailto:' + supportEmail}" style="color:#0061ED;font-weight:600;" th:text="${supportEmail}">support</a>
                and we’ll close it.
            </td>
        </tr>
    </table>
</th:block>
</body>
</html>
