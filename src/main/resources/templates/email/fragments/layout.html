<!DOCTYPE html>
<!--/* Shared email layout: every template passes its hero and body blocks into email(...). */-->
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:fragment="email(title, preheader, pill, tone, hero, content, reason)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light">
    <title th:text="${title}">Elimika</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #E9EDF5; -webkit-text-size-adjust: 100%; }
        table { border-collapse: collapse; }
        a { color: #0061ED; }
        @media (max-width: 620px) {
            .card { width: 100% !important; border-radius: 0 !important; border-left: 0 !important; border-right: 0 !important; }
            .px { padding-left: 22px !important; padding-right: 22px !important; }
            .h1 { font-size: 24px !important; }
            .stack { display: block !important; width: 100% !important; box-sizing: border-box; }
        }
    </style>
</head>
<body style="margin:0;padding:0;background:#E9EDF5;">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#E9EDF5;opacity:0;"
     th:text="${preheader}">Preview</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#E9EDF5;">
    <tr>
        <td align="center" style="padding:32px 12px;">
            <table role="presentation" class="card" width="600" cellpadding="0" cellspacing="0"
                   style="width:600px;max-width:600px;background:#FFFFFF;border:1px solid #DCE2EC;border-radius:20px;overflow:hidden;font-family:'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif;color:#344054;">
                <tr>
                    <td class="px" style="padding:22px 36px;border-bottom:1px solid #EEF1F6;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                                <td style="vertical-align:middle;"><img src="cid:elimikaLogo" width="58" height="40" alt="Elimika" style="display:block;border:0;"></td>
                                <td align="right" style="vertical-align:middle;">
                                    <span th:style="'display:inline-block;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px;color:' + ${tones.get(tone)['text']} + ';background:' + ${tones.get(tone)['chip']} + ';'"
                                          th:text="${pill}">Pill</span>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td class="px" th:style="'padding:36px;background:' + ${tones.get(tone)['tint']} + ';'">
                        <th:block th:replace="${hero}"></th:block>
                    </td>
                </tr>
                <tr>
                    <td class="px" style="padding:32px 36px;">
                        <th:block th:replace="${content}"></th:block>
                    </td>
                </tr>
                <tr>
                    <td class="px" style="padding:26px 36px 30px;background:#F7F9FC;border-top:1px solid #EEF1F6;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                                <td style="font-size:13px;font-weight:700;color:#0B1736;">Learn, teach and grow on Elimika</td>
                                <td align="right" style="font-size:12px;color:#5B6474;white-space:nowrap;">
                                    <a href="https://sarafrika.com" style="color:#5B6474;text-decoration:none;">Powered by&nbsp;<img src="cid:sarafrikaLogo" width="68" height="20" alt="Sarafrika" style="vertical-align:middle;border:0;"></a>
                                </td>
                            </tr>
                        </table>
                        <p style="margin:14px 0 0;font-size:13px;">
                            <a th:href="${frontendUrl}" style="color:#344054;">Open Elimika</a>
                            <span style="color:#C2C9D6;">&nbsp;·&nbsp;</span>
                            <a th:href="${'mailto:' + supportEmail}" style="color:#344054;" th:text="${supportEmail}">support</a>
                            <span style="color:#C2C9D6;">&nbsp;·&nbsp;</span>
                            <a href="https://sarafrika.com" style="color:#344054;">sarafrika.com</a>
                        </p>
                        <p style="margin:10px 0 0;font-size:12px;line-height:1.6;color:#5B6474;">
                            <span th:text="${reason}">Reason</span> © <span th:text="${currentYear}">2026</span> Sarafrika.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>

<!--/* Building blocks used inside hero and content blocks. */-->

<p th:fragment="eyebrow(text, tone)"
   th:style="'margin:0 0 10px;font-size:14px;font-weight:700;color:' + ${tones.get(tone)['text']} + ';'"
   th:text="${text}">Eyebrow</p>

<h1 th:fragment="h1(text)" class="h1"
    style="margin:0;font-size:28px;line-height:1.25;font-weight:800;letter-spacing:-0.01em;color:#0B1736;"
    th:text="${text}">Heading</h1>

<p th:fragment="lead(text)" style="margin:14px 0 0;font-size:16px;line-height:1.6;color:#344054;"
   th:text="${text}">Lead</p>

<p th:fragment="para(text)" style="margin:0 0 22px;font-size:15px;line-height:1.65;color:#344054;"
   th:text="${text}">Paragraph</p>

<p th:fragment="label(text)"
   style="margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#5B6474;"
   th:text="${text}">Label</p>

<tr th:fragment="factHead(text)">
    <td colspan="2" style="padding:12px 18px;background:#F7F9FC;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#5B6474;"
        th:text="${text}">Details</td>
</tr>

<tr th:fragment="fact(label, value)">
    <td style="padding:13px 18px;border-top:1px solid #EEF1F6;font-size:14px;color:#5B6474;vertical-align:top;" th:text="${label}">Label</td>
    <td align="right" style="padding:13px 18px;border-top:1px solid #EEF1F6;font-size:14px;font-weight:600;color:#0B1736;vertical-align:top;" th:text="${value}">Value</td>
</tr>

<tr th:fragment="factChip(label, value, tone)">
    <td style="padding:13px 18px;border-top:1px solid #EEF1F6;font-size:14px;color:#5B6474;" th:text="${label}">Label</td>
    <td align="right" style="padding:13px 18px;border-top:1px solid #EEF1F6;">
        <span th:style="'display:inline-block;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;color:' + ${tones.get(tone)['text']} + ';background:' + ${tones.get(tone)['chip']} + ';'"
              th:text="${value}">Chip</span>
    </td>
</tr>

<table th:fragment="note(label, text)" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;">
    <tr>
        <td style="padding:18px 20px;background:#F7F9FC;border-radius:14px;">
            <p style="margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#5B6474;" th:text="${label}">Label</p>
            <p style="margin:0;font-size:15px;line-height:1.6;color:#0B1736;white-space:pre-line;" th:text="${text}">Text</p>
        </td>
    </tr>
</table>

<table th:fragment="callout(text, tone)" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;">
    <tr>
        <td th:style="'padding:16px 18px;border-radius:14px;font-size:14px;line-height:1.55;color:#344054;background:' + ${tones.get(tone)['tint']} + ';'"
            th:utext="${text}">Callout</td>
    </tr>
</table>

<table th:fragment="step(num, title, text, active)" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 16px;">
    <tr>
        <td width="44" style="vertical-align:top;">
            <div th:style="${active} ? 'width:30px;height:30px;line-height:30px;border-radius:999px;text-align:center;font-size:13px;font-weight:700;background:#0061ED;color:#FFFFFF;' : 'width:30px;height:30px;line-height:30px;border-radius:999px;text-align:center;font-size:13px;font-weight:700;background:#EAF1FF;color:#0047B3;'"
                 th:text="${num}">1</div>
        </td>
        <td style="vertical-align:top;">
            <p style="margin:0 0 3px;font-size:15px;font-weight:700;color:#0B1736;" th:text="${title}">Title</p>
            <p style="margin:0;font-size:14px;line-height:1.55;color:#5B6474;" th:text="${text}">Text</p>
        </td>
    </tr>
</table>

<table th:fragment="button(href, text)" role="presentation" cellpadding="0" cellspacing="0" style="margin:4px 0 26px;">
    <tr>
        <td style="border-radius:12px;background:#0061ED;">
            <a th:href="${href}" style="display:inline-block;padding:14px 26px;font-size:15px;font-weight:700;color:#FFFFFF;text-decoration:none;border-radius:12px;"
               th:text="${text}">Button</a>
        </td>
    </tr>
</table>

<p th:fragment="small(text)" style="margin:0;font-size:14px;line-height:1.6;color:#5B6474;" th:utext="${text}">Small print</p>
