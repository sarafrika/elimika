<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email('Team member joined',
                    ${'Your invitation was accepted. ' + recipientName + ' is now part of ' + organisationName + '.'},
                    'Team member joined', 'green', ~{::hero}, ~{::content},
                    'You’re receiving this because you invited this person to your organisation.')}">
<body>
<th:block th:fragment="hero">
    <h1 th:replace="~{email/fragments/layout :: h1(${recipientName + ' accepted your invitation'})}"></h1>
    <p th:replace="~{email/fragments/layout :: lead(${recipientName + ' is now part of ' + organisationName + ' on Elimika as ' + roleName + '.'})}"></p>
</th:block>
<th:block th:fragment="content">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;border:1px solid #E4E9F2;border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden;">
        <tr th:replace="~{email/fragments/layout :: factHead('Member')}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Name', ${recipientName})}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Role', ${fmt.capitalize(roleName)})}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Organisation', ${organisationName})}"></tr>
    </table>

    <p th:replace="~{email/fragments/layout :: label('Suggested next steps')}"></p>
    <table th:replace="~{email/fragments/layout :: step('1', 'Add them to a class', 'Choose the classes, branch and venues they belong to.', false)}"></table>
    <table th:replace="~{email/fragments/layout :: step('2', 'Share your timetable', 'They see their sessions as soon as they’re scheduled.', false)}"></table>

    <table th:replace="~{email/fragments/layout :: button(${fmt.has(membersLink) ? membersLink : frontendUrl + '/dashboard/organisation'}, 'View your team')}"></table>
</th:block>
</body>
</html>
