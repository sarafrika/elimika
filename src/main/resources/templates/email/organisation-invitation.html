<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email('Invitation',
                    ${(fmt.has(inviterName) ? inviterName + ' invited you' : 'You’re invited') + ' to join ' + organisationName + ' as ' + roleName + '.'},
                    'Invitation', 'blue', ~{::hero}, ~{::content},
                    ${'You’re receiving this because ' + organisationName + ' invited this address to Elimika.'})}">
<body>
<th:block th:fragment="hero">
    <p th:replace="~{email/fragments/layout :: eyebrow(${organisationName}, 'blue')}"></p>
    <h1 th:replace="~{email/fragments/layout :: h1(${'You’re invited to join ' + organisationName})}"></h1>
    <p th:replace="~{email/fragments/layout :: lead(${'Hi ' + fmt.firstName(recipientName) + ', ' + (fmt.has(inviterName) ? inviterName + ' would like you' : 'they’d like you') + ' to join their team on Elimika as ' + roleName + '.'})}"></p>
</th:block>
<th:block th:fragment="content">
    <th:block th:if="${fmt.has(personalMessage)}">
        <table th:replace="~{email/fragments/layout :: note(${fmt.has(inviterName) ? 'Message from ' + inviterName : 'Their message'}, ${personalMessage})}"></table>
    </th:block>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;border:1px solid #E4E9F2;border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden;">
        <tr th:replace="~{email/fragments/layout :: factHead('Invitation details')}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Organisation', ${organisationName})}"></tr>
        <tr th:replace="~{email/fragments/layout :: fact('Your role', ${fmt.capitalize(roleName)})}"></tr>
        <th:block th:if="${fmt.has(inviterName)}"><tr th:replace="~{email/fragments/layout :: fact('Invited by', ${inviterName})}"></tr></th:block>
        <th:block th:if="${fmt.has(expiresAt)}"><tr th:replace="~{email/fragments/layout :: fact('Invitation expires', ${fmt.date(expiresAt)})}"></tr></th:block>
    </table>

    <table th:replace="~{email/fragments/layout :: button(${invitationLink}, 'Accept invitation')}"></table>

    <p th:replace="~{email/fragments/layout :: small(${existingUser != null and existingUser}
        ? 'Sign in with your Elimika account to accept. Not expecting this? You can ignore it; nothing happens unless you accept.'
        : 'First time on Elimika? Accepting creates your account, and you’ll get a link to set your password. Not expecting this? You can ignore it; nothing happens unless you accept.')}"></p>
</th:block>
</body>
</html>
