<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns:th="http://www.thymeleaf.org" dir="ltr" lang="en">
  <head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type" />
    <meta name="x-apple-disable-message-reformatting" />
    <title th:text="${title}">Announcement</title>
  </head>
  <body dir="ltr" lang="en" style="background-color:#f4f7fb;margin:0">
    <table border="0" width="100%" cellpadding="0" cellspacing="0" role="presentation" align="center">
      <tbody>
        <tr>
          <td style="margin:0;background-color:#f4f7fb;color:#172033;font-family:Arial, Helvetica, sans-serif">
            <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation"
                   style="max-width:640px;width:100%;margin:0 auto">
              <tbody>
                <tr style="width:100%">
                  <td style="padding:32px 16px">
                    <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation"
                           style="background-color:#ffffff;border-radius:12px;overflow:hidden">
                      <tbody>
                        <tr>
                          <td style="padding:24px 32px;background-color:#0f766e;color:#ffffff">
                            <p style="margin:0;font-size:13px;letter-spacing:0.4px;text-transform:uppercase;opacity:0.85"
                               th:text="${organisationName} ?: ${applicationName}">Organisation</p>
                          </td>
                        </tr>
                        <tr>
                          <td style="padding:32px">
                            <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;color:#172033"
                                th:text="${title}">Announcement</h1>
                            <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#334155;white-space:pre-line"
                               th:text="${body}">Message body.</p>
                            <p style="margin:24px 0 0;font-size:13px;color:#64748b">
                              You are receiving this because you are a member of
                              <span th:text="${organisationName} ?: 'your organisation'">your organisation</span>
                              on <span th:text="${applicationName}">Elimika</span>.
                            </p>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                    <p style="text-align:center;margin:24px 0 0;font-size:12px;color:#94a3b8">
                      &copy; <span th:text="${currentYear}">2026</span> <span th:text="${applicationName}">Elimika</span>.
                      Need help? <a th:href="'mailto:' + ${supportEmail}" style="color:#0f766e"
                                    th:text="${supportEmail}">support@sarafrika.com</a>
                    </p>
                  </td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
