<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email(${title}, ${fmt.has(organisationName) ? 'A message from ' + organisationName : 'A message from your organisation'},
                    'Announcement', 'blue', ~{::hero}, ~{::content},
                    ${'You’re receiving this because you’re a member of ' + (fmt.has(organisationName) ? organisationName : 'an organisation') + ' on Elimika.'})}">
<body>
<th:block th:fragment="hero">
    <p th:replace="~{email/fragments/layout :: eyebrow(${fmt.has(organisationName) ? organisationName : 'Announcement'}, 'blue')}"></p>
    <h1 th:replace="~{email/fragments/layout :: h1(${title})}"></h1>
</th:block>
<th:block th:fragment="content">
    <p style="margin:0 0 26px;font-size:16px;line-height:1.7;color:#344054;white-space:pre-line;" th:text="${body}">Body</p>
    <table th:replace="~{email/fragments/layout :: button(${frontendUrl + '/dashboard'}, 'Open in Elimika')}"></table>
    <p th:replace="~{email/fragments/layout :: small('This message was sent by your organisation to its members. Questions about it are best sent to them directly.')}"></p>
</th:block>
</body>
</html>
