<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email(${'You’re enrolled: ' + courseName},
                    ${fmt.has(courseStartDate) ? 'Your course starts ' + fmt.date(courseStartDate) + '. Here’s everything you need before you begin.' : 'Here’s everything you need before you begin.'},
                    'Enrolled', 'blue', ~{::hero}, ~{::content},
                    'You’re receiving this because you enrolled in a course on Elimika.')}">
<body>
<th:block th:fragment="hero">
    <p th:replace="~{email/fragments/layout :: eyebrow(${'Welcome to class, ' + fmt.firstName(recipientName)}, 'blue')}"></p>
    <h1 th:replace="~{email/fragments/layout :: h1(${'You’re enrolled in ' + courseName})}"></h1>
</th:block>
<th:block th:fragment="content">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;border:1px solid #E4E9F2;border-radius:16px;border-collapse:separate;border-spacing:0;overflow:hidden;">
        <tr th:if="${fmt.has(courseImageUrl)}">
            <td colspan="2" style="padding:0;"><img th:src="${courseImageUrl}" th:alt="${courseName}" width="526" style="display:block;width:100%;max-width:526px;height:auto;border:0;"></td>
        </tr>
        <tr th:if="${fmt.has(courseDescription)}">
            <td colspan="2" style="padding:18px 18px 4px;font-size:15px;line-height:1.6;color:#344054;" th:text="${courseDescription}">Description</td>
        </tr>
        <th:block th:if="${fmt.has(courseStartDate)}"><tr th:replace="~{email/fragments/layout :: fact('Starts', ${fmt.date(courseStartDate)})}"></tr></th:block>
        <th:block th:if="${fmt.has(instructorName)}"><tr th:replace="~{email/fragments/layout :: fact('Instructor', ${instructorName})}"></tr></th:block>
        <th:block th:if="${isStartingSoon != null and isStartingSoon}"><tr th:replace="~{email/fragments/layout :: factChip('Status', 'Starting soon', 'amber')}"></tr></th:block>
    </table>

    <th:block th:if="${fmt.has(welcomeMessage)}">
        <table th:replace="~{email/fragments/layout :: note(${fmt.has(instructorName) ? 'A welcome from ' + instructorName : 'A welcome from your instructor'}, ${welcomeMessage})}"></table>
    </th:block>

    <p th:replace="~{email/fragments/layout :: label('Before your first class')}"></p>
    <table th:replace="~{email/fragments/layout :: step('1', 'Check your timetable', 'All your sessions are on your Elimika calendar.', true)}"></table>
    <table th:replace="~{email/fragments/layout :: step('2', 'Preview the first lesson', 'Get a feel for the course before you start.', false)}"></table>
    <table th:replace="~{email/fragments/layout :: step('3', 'Know how you’ll be graded', 'Your course page shows each assessment, its weight and the pass mark.', false)}"></table>

    <table th:replace="~{email/fragments/layout :: button(${frontendUrl + '/dashboard/student/courses'}, 'Start learning')}"></table>
</th:block>
</body>
</html>
