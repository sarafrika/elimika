<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{email/fragments/layout :: email('Hire not completed',
                    ${clashCount + ' of the sessions in ' + contextName + ' overlap with ' + instructorName + '’s other classes.'},
                    'Hire not completed', 'amber', ~{::hero}, ~{::content},
                    'You’re receiving this because you manage class jobs for your organisation on Elimika.')}">
<body>
<th:block th:fragment="hero">
    <h1 th:replace="~{email/fragments/layout :: h1('A schedule clash blocked this hire')}"></h1>
    <p th:replace="~{email/fragments/layout :: lead(${'Hi ' + fmt.firstName(recipientName) + ', we couldn’t hire ' + instructorName + ' for ' + contextName + ' because some sessions overlap with classes they already teach.'})}"></p>
</th:block>
<th:block th:fragment="content">
    <p th:replace="~{email/fragments/layout :: label(${'Clashing sessions · ' + clashCount})}"></p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;border:1px solid #F5D9B5;border-radius:14px;border-collapse:separate;border-spacing:0;background:#FFFCF6;overflow:hidden;">
        <tr>
            <td style="padding:14px 18px;font-size:14px;color:#5B6474;">First clash</td>
            <td align="right" style="padding:14px 18px;font-size:14px;font-weight:700;color:#0B1736;" th:text="${fmt.dateTime(firstClashAt)}">When</td>
        </tr>
        <tr th:each="reason : ${clashReasons}">
            <td colspan="2" style="padding:12px 18px;border-top:1px solid #F5D9B5;font-size:14px;line-height:1.5;color:#344054;" th:text="${reason}">Reason</td>
        </tr>
    </table>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;">
        <tr>
            <td style="padding:16px 18px;border-radius:14px;background:#F7F9FC;font-size:14px;line-height:1.55;color:#344054;"
                th:text="${jobPosted != null and jobPosted}
                    ? 'Nothing changed: their application and your class job are just as they were.'
                    : 'Nothing changed, and the job was not posted. You can post it without naming them to take applications.'">Nothing changed.</td>
        </tr>
    </table>

    <p th:replace="~{email/fragments/layout :: label('Your options')}"></p>
    <table th:replace="~{email/fragments/layout :: step('1', 'Choose another applicant', 'Other instructors may still be waiting for review.', false)}"></table>
    <table th:replace="~{email/fragments/layout :: step('2', 'Adjust the class schedule', 'Move the clashing sessions, then try the hire again.', false)}"></table>

    <table th:replace="~{email/fragments/layout :: button(${frontendUrl + actionPath}, 'Go to class jobs')}"></table>
</th:block>
</body>
</html>
