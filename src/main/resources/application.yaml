spring:
  application:
    name: ELIMIKA

  profiles:
    active: prod

  # Multipart file upload configuration
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  modulith:
    detection-strategy: explicitly-annotated
    republish-outstanding-events-on-restart: true

  # Allow migrations authored on parallel branches to apply even when their
  # version predates an already-applied migration (out-of-order merges).
  flyway:
    out-of-order: true

  # Mail configuration
  mail:
    host: ${MAIL_SERVER:}
    port: ${MAIL_SERVER_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    test-connection: false
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  #Jackson Mapper Configuration
  jackson:
    # All instants are emitted/consumed as UTC ISO-8601 (see JacksonConfig).
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    mapper:
      accept-case-insensitive-enums: true

  # Security OAuth2 configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:${app.keycloak.serverUrl}/realms/${app.keycloak.realm}}
          jwk-set-uri: ${JWT_JWK_SET_URI:${app.keycloak.serverUrl}/realms/${app.keycloak.realm}/protocol/openid-connect/certs}

# Application-specific configuration
app:
  # The OpenAPI specification enumerates every route, parameter and payload the API accepts,
  # administrative ones included, so it is not public content. Off means platform administrators
  # only (see SecurityConfiguration); an environment that genuinely wants a browsable spec — a
  # workstation, a sandbox, or staging while the frontend client is regenerated from it — sets
  # APP_API_DOCS_PUBLIC=true in its own environment.
  #
  # The `dev` profile turns this on (application-dev.yaml), the same way the commerce module
  # relaxes its paywall for dev — so staging serves the spec that the frontend regenerates its
  # client from, and prod does not. APP_API_DOCS_PUBLIC overrides either way. Documented in
  # docs/api-documentation-access.md.
  api-docs:
    public: ${APP_API_DOCS_PUBLIC:false}

  bootstrap:
    admin:
      enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      first-name: ${APP_BOOTSTRAP_ADMIN_FIRST_NAME:}
      middle-name: ${APP_BOOTSTRAP_ADMIN_MIDDLE_NAME:}
      last-name: ${APP_BOOTSTRAP_ADMIN_LAST_NAME:}
      phone-number: ${APP_BOOTSTRAP_ADMIN_PHONE_NUMBER:}

  keycloak:
    serverUrl: ${APP_KEYCLOAK_SERVERURL:http://localhost:8080}
    realm: ${APP_KEYCLOAK_REALM:elimika}
    clientId: ${APP_KEYCLOAK_CLIENTID:elimika-backend}
    clientSecret: ${APP_KEYCLOAK_CLIENTSECRET:}
    user:
      attributes:
        - user_domain

  email:
    from: no-reply@sarafrika.com
    from-name: Elimika
    frontend:
      url: https://elimika.sarafrika.com

storage:
  location: ${STORAGE_PATH:${user.home}/elimika-storage}
  base-url: ${STORAGE_BASE_URL:https://api.elimika.sarafrika.com}
  folders:
    profile-images: ${PROFILE_IMAGES_FOLDER:profile_images}
    course-thumbnails: ${COURSE_THUMBNAILS_FOLDER:course_thumbnails}
    course-banners: ${COURSE_BANNERS_FOLDER:course_banners}
    course-materials: ${COURSE_MATERIALS_FOLDER:course_materials}
    class-thumbnails: ${CLASS_THUMBNAILS_FOLDER:class_thumbnails}
    class-promotional-videos: ${CLASS_PROMOTIONAL_VIDEOS_FOLDER:class_promotional_videos}
    organization-logos: ${ORGANIZATION_LOGOS_FOLDER:organization_logos}
    certificates: ${CERTIFICATES_FOLDER:certificates}
    assignments: ${ASSIGNMENTS_FOLDER:assignments}
    temp: ${TEMP_FOLDER:temp}

logging:
  level:
    root: INFO
    org.springframework: INFO
  file:
    name: logs/elimika.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      total-size-cap: 100MB
      max-history: 90

commerce:
  internal:
    enabled: ${COMMERCE_INTERNAL_ENABLED:false}
    default-currency: ${COMMERCE_INTERNAL_DEFAULT_CURRENCY:KES}
  payment:
    callback:
      # Keycloak clients whose service-account token may read and settle an order that is not its
      # own — the M-Pesa gateway posting to /orders/{id}/payment-callback. Any other service account
      # is refused and logged; the reconciliation sweep below still settles the payment within the
      # minute, so a wrong name here delays capture rather than losing it.
      client-ids: ${COMMERCE_PAYMENT_CALLBACK_CLIENT_IDS:mpesa-service}
    reconciliation:
      # An STK prompt lives about a minute, so this sweep is deliberately tight: it is the safety net
      # for a payment whose callback never arrived and whose buyer closed the tab.
      initial-delay: ${COMMERCE_PAYMENT_RECONCILIATION_INITIAL_DELAY:PT60S}
      interval: ${COMMERCE_PAYMENT_RECONCILIATION_INTERVAL:PT60S}
  capture:
    # Dev default true: checkout auto-captures without a gateway. In prod set false so
    # capture is driven only by confirmed M-Pesa payments (COMMERCE_CAPTURE_AUTO_ON_COMPLETE=false).
    auto-on-complete: ${COMMERCE_CAPTURE_AUTO_ON_COMPLETE:true}

wallet:
  ledger:
    reconciliation:
      # Compares every wallet's balance_amount against the balance derived from its ledger entries.
      # The sweep is bounded: batch-size wallets per query, at most max-batches-per-run batches per
      # run, so a large wallet table is walked in slices rather than in one long transaction.
      initial-delay: ${WALLET_LEDGER_RECONCILIATION_INITIAL_DELAY:PT5M}
      interval: ${WALLET_LEDGER_RECONCILIATION_INTERVAL:PT1H}
      batch-size: ${WALLET_LEDGER_RECONCILIATION_BATCH_SIZE:500}
      max-batches-per-run: ${WALLET_LEDGER_RECONCILIATION_MAX_BATCHES:20}

mpesa:
  service:
    base-url: ${MPESA_SERVICE_BASE_URL:}
    shortcode-uuid: ${MPESA_SERVICE_SHORTCODE_UUID:}
    # OAuth2 client-credentials against Keycloak; the resulting bearer token authenticates
    # elimika to the mpesa-service gateway (replaces the previous HTTP Basic credentials).
    # Defaults reuse elimika's existing confidential Keycloak client (elimika-backend) and its
    # realm token endpoint, so no separate client must be provisioned. MPESA_CLIENT_ID/SECRET and
    # MPESA_OAUTH_TOKEN_URI remain optional overrides.
    oauth:
      token-uri: ${MPESA_OAUTH_TOKEN_URI:${app.keycloak.serverUrl}/realms/${app.keycloak.realm}/protocol/openid-connect/token}
      client-id: ${MPESA_CLIENT_ID:${APP_KEYCLOAK_CLIENTID:elimika-backend}}
      client-secret: ${MPESA_CLIENT_SECRET:${APP_KEYCLOAK_CLIENTSECRET:}}

# OpenAPI / Swagger configuration.
#
# SecurityConfiguration reads api-docs.path and swagger-ui.path back out and derives its guard
# from them (see apiDocumentationPaths()), including the .yaml and grouped aliases springdoc
# registers off the same property, so moving a path here moves the guard with it. show-actuator
# stays false so the actuator endpoints never leak into the published specification, and the
# actuator-hosted springdoc endpoints stay unregistered because management.endpoints.web.exposure
# below lists only health, info and metrics.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: false

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    defaults:
      enabled: true
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
