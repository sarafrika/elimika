spring:
  application:
    name: ELIMIKA

  profiles:
    active: prod
    # `local` (the docker/compose.local.yaml workstation stack) is a relaxed environment too.
    group:
      local: dev

  # Multipart file upload configuration
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  # Keep Boot's applicationTaskExecutor (and keep it the default for @Async) even when a module
  # declares its own Executor bean - the search module's single-threaded searchIndexExecutor would
  # otherwise make Boot back off and leave every other @Async method on that one thread.
  task:
    execution:
      mode: force

  modulith:
    detection-strategy: explicitly-annotated
    republish-outstanding-events-on-restart: true

  # Allow migrations authored on parallel branches to apply even when their
  # version predates an already-applied migration (out-of-order merges).
  flyway:
    out-of-order: true

  # Mail configuration
  mail:
    host: ${MAIL_SERVER:}
    port: ${MAIL_SERVER_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    test-connection: false
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  # Connection pool. The URL and credentials still come from SPRING_DATASOURCE_* in each environment.
  # A short acquire timeout makes an exhausted pool fail fast (mapped to 503 + Retry-After by the
  # global exception handler) instead of parking request threads for 30s until the container is
  # unhealthy. Size the pool with DB_POOL_MAX, keeping max_connections on the server in mind.
  datasource:
    hikari:
      pool-name: elimika
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 5
      connection-timeout: ${DB_POOL_TIMEOUT_MS:3000}
      # Logs a stack trace for any connection held longer than 20s (diagnostic only, never closes it).
      leak-detection-threshold: 20000

  # JPA configuration
  jpa:
    # Off: with open-in-view a request held its database connection from the first query until the
    # response was written, so slow clients and JSON serialisation pinned pool connections. Entities
    # must now be mapped to DTOs inside a @Transactional service method before leaving it.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  #Jackson Mapper Configuration
  jackson:
    # All instants are emitted/consumed as UTC ISO-8601 (see JacksonConfig).
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    mapper:
      accept-case-insensitive-enums: true

  # Security OAuth2 configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:${app.keycloak.serverUrl}/realms/${app.keycloak.realm}}
          jwk-set-uri: ${JWT_JWK_SET_URI:${app.keycloak.serverUrl}/realms/${app.keycloak.realm}/protocol/openid-connect/certs}

# Application-specific configuration
app:
  # The OpenAPI specification enumerates every route, parameter and payload the API accepts,
  # administrative ones included, so it is not public content. Off means platform administrators
  # only (see SecurityConfiguration); an environment that genuinely wants a browsable spec — a
  # workstation, a sandbox, or staging while the frontend client is regenerated from it — sets
  # APP_API_DOCS_PUBLIC=true in its own environment.
  #
  # The `dev` profile turns this on (application-dev.yaml), the same way the commerce module
  # relaxes its paywall for dev — so staging serves the spec that the frontend regenerates its
  # client from, and prod does not. APP_API_DOCS_PUBLIC overrides either way. Documented in
  # docs/api-documentation-access.md.
  api-docs:
    public: ${APP_API_DOCS_PUBLIC:false}

  # Startup sweep that NULLs course/programme/class media columns whose stored file is missing.
  # Skipped when more than sweep-max-missing-ratio of references look missing (unmounted volume).
  media:
    sweep-dangling-refs: ${APP_MEDIA_SWEEP_DANGLING_REFS:false}
    sweep-max-missing-ratio: ${APP_MEDIA_SWEEP_MAX_MISSING_RATIO:0.5}

  bootstrap:
    admin:
      enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      first-name: ${APP_BOOTSTRAP_ADMIN_FIRST_NAME:}
      middle-name: ${APP_BOOTSTRAP_ADMIN_MIDDLE_NAME:}
      last-name: ${APP_BOOTSTRAP_ADMIN_LAST_NAME:}
      phone-number: ${APP_BOOTSTRAP_ADMIN_PHONE_NUMBER:}

  keycloak:
    serverUrl: ${APP_KEYCLOAK_SERVERURL:http://localhost:8080}
    realm: ${APP_KEYCLOAK_REALM:elimika}
    clientId: ${APP_KEYCLOAK_CLIENTID:elimika-backend}
    clientSecret: ${APP_KEYCLOAK_CLIENTSECRET:}
    user:
      attributes:
        - user_domain

  # Self-registration starts in Elimika (Keycloak self-registration is off). Domains listed under
  # approval-required-domains stay pending until a platform admin approves them. See
  # docs/guides/registration-and-approval.md.
  registration:
    redirect-uri: ${APP_REGISTRATION_REDIRECT_URI:${app.email.frontend.url}/login}
    client-id: ${APP_REGISTRATION_CLIENT_ID:elimika-ui}
    actions-email-lifespan-seconds: ${APP_REGISTRATION_ACTIONS_EMAIL_LIFESPAN_SECONDS:259200}
    approval-required-domains: ${APP_REGISTRATION_APPROVAL_REQUIRED_DOMAINS:instructor,course_creator,organisation_user}
    max-attempts-per-ip-per-hour: ${APP_REGISTRATION_MAX_ATTEMPTS_PER_IP_PER_HOUR:10}
    max-attempts-per-email-per-hour: ${APP_REGISTRATION_MAX_ATTEMPTS_PER_EMAIL_PER_HOUR:3}
    captcha:
      enabled: ${APP_REGISTRATION_CAPTCHA_ENABLED:false}
      secret: ${APP_REGISTRATION_CAPTCHA_SECRET:}

  email:
    from: no-reply@sarafrika.com
    from-name: Elimika
    # Times in emails are shown in this zone; stored values stay UTC.
    display-zone: ${APP_EMAIL_DISPLAY_ZONE:Africa/Nairobi}
    frontend:
      url: ${APP_EMAIL_FRONTEND_URL:https://elimika.sarafrika.com}

storage:
  location: ${STORAGE_PATH:${user.home}/elimika-storage}
  base-url: ${STORAGE_BASE_URL:https://api.elimika.sarafrika.com}
  folders:
    profile-images: ${PROFILE_IMAGES_FOLDER:profile_images}
    course-thumbnails: ${COURSE_THUMBNAILS_FOLDER:course_thumbnails}
    course-banners: ${COURSE_BANNERS_FOLDER:course_banners}
    course-materials: ${COURSE_MATERIALS_FOLDER:course_materials}
    class-thumbnails: ${CLASS_THUMBNAILS_FOLDER:class_thumbnails}
    class-promotional-videos: ${CLASS_PROMOTIONAL_VIDEOS_FOLDER:class_promotional_videos}
    organization-logos: ${ORGANIZATION_LOGOS_FOLDER:organization_logos}
    certificates: ${CERTIFICATES_FOLDER:certificates}
    assignments: ${ASSIGNMENTS_FOLDER:assignments}
    temp: ${TEMP_FOLDER:temp}

# Embedded Tomcat. Bounded so the worker pool stays proportional to the database pool (DB_POOL_MAX):
# 200 default threads all queueing on a 20-connection pool only multiplies latency and memory. Excess
# connections wait in the accept queue, and beyond that are refused, so overload sheds load early.
server:
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:60}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    connection-timeout: 10s

logging:
  level:
    root: INFO
    org.springframework: INFO
  file:
    name: logs/elimika.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      total-size-cap: 100MB
      max-history: 90

commerce:
  internal:
    enabled: ${COMMERCE_INTERNAL_ENABLED:false}
    default-currency: ${COMMERCE_INTERNAL_DEFAULT_CURRENCY:KES}
  payment:
    callback:
      # Keycloak clients whose service-account token may read and settle an order that is not its
      # own — the M-Pesa gateway posting to /orders/{id}/payment-callback. Any other service account
      # is refused and logged; the reconciliation sweep below still settles the payment within the
      # minute, so a wrong name here delays capture rather than losing it.
      client-ids: ${COMMERCE_PAYMENT_CALLBACK_CLIENT_IDS:mpesa-service}
    reconciliation:
      # An STK prompt lives about a minute, so this sweep is deliberately tight: it is the safety net
      # for a payment whose callback never arrived and whose buyer closed the tab.
      initial-delay: ${COMMERCE_PAYMENT_RECONCILIATION_INITIAL_DELAY:PT60S}
      interval: ${COMMERCE_PAYMENT_RECONCILIATION_INTERVAL:PT60S}
  capture:
    # Dev default true: checkout auto-captures without a gateway. In prod set false so
    # capture is driven only by confirmed M-Pesa payments (COMMERCE_CAPTURE_AUTO_ON_COMPLETE=false).
    auto-on-complete: ${COMMERCE_CAPTURE_AUTO_ON_COMPLETE:true}

wallet:
  ledger:
    reconciliation:
      # Compares every wallet's balance_amount against the balance derived from its ledger entries.
      # The sweep is bounded: batch-size wallets per query, at most max-batches-per-run batches per
      # run, so a large wallet table is walked in slices rather than in one long transaction.
      initial-delay: ${WALLET_LEDGER_RECONCILIATION_INITIAL_DELAY:PT5M}
      interval: ${WALLET_LEDGER_RECONCILIATION_INTERVAL:PT1H}
      batch-size: ${WALLET_LEDGER_RECONCILIATION_BATCH_SIZE:500}
      max-batches-per-run: ${WALLET_LEDGER_RECONCILIATION_MAX_BATCHES:20}

# Search (Meilisearch). Off by default: with SEARCH_ENABLED=false nothing is indexed, no HTTP call is
# made and every search falls back to the database. PostgreSQL stays the source of truth; indexes are
# disposable projections rebuilt through POST /api/v1/admin/search/... See docs/guides/search-platform.md.
search:
  enabled: ${SEARCH_ENABLED:false}
  # Rebuild an index on startup when its definition's schema version moved on.
  auto-rebuild: ${SEARCH_AUTO_REBUILD:false}
  # Reads are opted in per index, independently of indexing, e.g. SEARCH_READENABLED_COURSES=true
  # or search.read-enabled.courses=true.
  read-enabled: {}
  reconcile-interval: ${SEARCH_RECONCILE_INTERVAL:PT1H}
  resubmit-interval: ${SEARCH_RESUBMIT_INTERVAL:PT5M}
  resubmit-older-than: ${SEARCH_RESUBMIT_OLDER_THAN:PT5M}
  rebuild-batch-size: ${SEARCH_REBUILD_BATCH_SIZE:500}
  # Startup ensure-index/settings retries per index: attempts, and the first pause (doubles each time).
  startup-retry-attempts: ${SEARCH_STARTUP_RETRY_ATTEMPTS:5}
  startup-retry-initial-backoff: ${SEARCH_STARTUP_RETRY_INITIAL_BACKOFF:PT1S}
  # Nightly blue/green rebuild of every index (UTC), which refreshes names copied from other modules
  # (organisation, branch, course, program, instructor, creator). "-" disables it.
  full-rebuild-cron: ${SEARCH_FULL_REBUILD_CRON:0 30 1 * * *}
  meilisearch:
    host: ${SEARCH_MEILISEARCH_HOST:http://meilisearch:7700}
    # A scoped key (search + documents + indexes + settings + tasks + stats), never the master key.
    api-key: ${SEARCH_MEILISEARCH_API_KEY:}
    connect-timeout: ${SEARCH_MEILISEARCH_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${SEARCH_MEILISEARCH_READ_TIMEOUT:PT5S}
    # Index creation, settings, swaps and deletes can be slow while the engine is busy rebuilding.
    admin-read-timeout: ${SEARCH_MEILISEARCH_ADMIN_READ_TIMEOUT:PT30S}
    task-wait-timeout: ${SEARCH_MEILISEARCH_TASK_WAIT_TIMEOUT:PT30S}

mpesa:
  service:
    base-url: ${MPESA_SERVICE_BASE_URL:}
    shortcode-uuid: ${MPESA_SERVICE_SHORTCODE_UUID:}
    # OAuth2 client-credentials against Keycloak; the resulting bearer token authenticates
    # elimika to the mpesa-service gateway (replaces the previous HTTP Basic credentials).
    # Defaults reuse elimika's existing confidential Keycloak client (elimika-backend) and its
    # realm token endpoint, so no separate client must be provisioned. MPESA_CLIENT_ID/SECRET and
    # MPESA_OAUTH_TOKEN_URI remain optional overrides.
    oauth:
      token-uri: ${MPESA_OAUTH_TOKEN_URI:${app.keycloak.serverUrl}/realms/${app.keycloak.realm}/protocol/openid-connect/token}
      client-id: ${MPESA_CLIENT_ID:${APP_KEYCLOAK_CLIENTID:elimika-backend}}
      client-secret: ${MPESA_CLIENT_SECRET:${APP_KEYCLOAK_CLIENTSECRET:}}

# OpenAPI / Swagger configuration.
#
# SecurityConfiguration reads api-docs.path and swagger-ui.path back out and derives its guard
# from them (see apiDocumentationPaths()), including the .yaml and grouped aliases springdoc
# registers off the same property, so moving a path here moves the guard with it. show-actuator
# stays false so the actuator endpoints never leak into the published specification, and the
# actuator-hosted springdoc endpoints stay unregistered because management.endpoints.web.exposure
# below lists only health, info and metrics.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: false

# Actuator configuration
management:
  # management.server.port is deliberately NOT set here, so actuator stays on the main port by default
  # (staging's healthcheck curls localhost:<server.port>/actuator/health). Set MANAGEMENT_SERVER_PORT
  # (e.g. 8081, as docker/compose.loadtest.yaml does) to move actuator onto its own port; Prometheus
  # scrapes /actuator/prometheus anonymously on that port only (see SecurityConfiguration).
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      # Exposes /actuator/health/liveness and /readiness outside Kubernetes too; the container
      # healthcheck in docker/compose.yaml probes liveness.
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s,10s
  health:
    defaults:
      enabled: true
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
