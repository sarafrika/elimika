name: Deploy to Staging VPS

on:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      deployment_reason:
        description: 'Reason for manual deployment (optional)'
        required: false
        default: 'Manual deployment'
        type: string

jobs:
  deploy:
    # For workflow_run: only deploy if the triggering workflow succeeded
    # For workflow_dispatch: always deploy
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run Deployment over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYMENT_REASON: ${{ github.event.inputs.deployment_reason }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USERNAME }}
          password: ${{ secrets.STAGING_SSH_PASSWORD }}
          envs: EVENT_NAME,DEPLOYMENT_REASON,WORKFLOW_RUN_NAME
          script: |
            set -euo pipefail
            cd /opt/sarafrika/elimika

            if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
              echo "🚀 Manual Deployment Triggered"
              echo "Reason: $DEPLOYMENT_REASON"
            else
              echo "🔄 Automatic Deployment (triggered by successful build)"
              echo "Triggering workflow: $WORKFLOW_RUN_NAME"
            fi
            echo ""

            echo "🧮 Ensuring the container memory limit..."
            # The image sizes its heap as a PERCENTAGE of the container limit (see the ENTRYPOINT in
            # the Dockerfile), so without a limit the JVM sizes against the whole host and would claim
            # several GiB on a box shared with Postgres, Keycloak and the rest. This deploy never
            # checks out the repo, so docker/compose.yaml in git cannot reach the server - the limit
            # has to be written here. Uses the auto-discovered override name so the bare
            # `docker compose` calls below pick it up without changing how they resolve files.
            BASE=$(ls compose.yaml compose.yml docker-compose.yaml docker-compose.yml 2>/dev/null | head -1)
            if [ -z "$BASE" ]; then
              echo "❌ No compose file found in $(pwd)"; exit 1
            fi
            OVERRIDE="${BASE%.*}.override.${BASE##*.}"
            if [ -e "$OVERRIDE" ] && ! grep -q "managed-by: elimika-deploy" "$OVERRIDE"; then
              echo "⚠️  $OVERRIDE already exists and is not managed here - leaving it untouched."
              echo "    Add the mem_limit below to it by hand, or this deploy will fail the check."
            else
              cat > "$OVERRIDE" <<'YAML'
            # managed-by: elimika-deploy
            # Generated by .github/workflows/deploy.yml on every deploy - hand edits are overwritten.
            # Keep in step with docker/compose.yaml in the repo, which documents the sizing.
            services:
              elimika:
                mem_limit: 1536m
                mem_reservation: 768m
            YAML
              echo "  wrote $OVERRIDE"
            fi

            echo "📥 Pulling backend image..."
            docker compose pull elimika

            echo "🚀 Recreating backend container..."
            docker compose up -d --no-deps elimika

            echo "🔍 Verifying the memory limit actually applied..."
            MEM=$(docker inspect elimika -f '{{.HostConfig.Memory}}')
            if [ "$MEM" = "0" ]; then
              echo "❌ Container has no memory limit, so the image's percentage-based heap sizing"
              echo "   would target the whole host. Refusing to report this deploy as successful."
              exit 1
            fi
            echo "  limit = $((MEM / 1024 / 1024)) MiB"

            echo "🔍 Verifying the running container is the image we just pulled..."
            LATEST_ID=$(docker image inspect sarafrika/elimika:latest -f '{{.Id}}')
            RUNNING_ID=$(docker inspect elimika -f '{{.Image}}')
            echo "  latest  = $LATEST_ID"
            echo "  running = $RUNNING_ID"
            if [ "$LATEST_ID" != "$RUNNING_ID" ]; then
              echo "❌ Running image does not match the pulled :latest — deploy did not take effect"
              exit 1
            fi

            echo "🩺 Waiting for the backend to report healthy..."
            for i in $(seq 1 24); do
              STATUS=$(docker inspect elimika -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')
              echo "  attempt $i/24: $STATUS"
              if [ "$STATUS" = "healthy" ]; then break; fi
              if [ "$STATUS" = "unhealthy" ]; then
                echo "❌ Backend reported unhealthy"; docker logs elimika --tail 60; exit 1
              fi
              sleep 5
            done

            STATUS=$(docker inspect elimika -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')
            if [ "$STATUS" != "healthy" ]; then
              echo "❌ Backend did not become healthy within ~2 minutes"; docker logs elimika --tail 60; exit 1
            fi

            echo ""
            echo "✅ Deployment completed successfully — backend healthy on the latest image!"
            echo "🌍 Service available on port 30000"
