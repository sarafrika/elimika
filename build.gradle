plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.10'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'apps.sarafrika'
version = '0.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}


ext {
	set('springModulithVersion', "2.0.10")
}

dependencies {
	implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.9'
	implementation 'org.sqids:sqids:0.1.0'
	implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
	implementation 'org.keycloak:keycloak-admin-client:26.0.6'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation "org.springframework.boot:spring-boot-starter-restclient"
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'io.jsonwebtoken:jjwt:0.12.6'
	implementation 'com.google.crypto.tink:tink:1.17.0'
	implementation 'net.coobird:thumbnailator:0.4.20'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.springframework.modulith:spring-modulith-starter-jpa'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation "org.springframework.boot:spring-boot-starter-actuator-test"
    testImplementation "org.springframework.boot:spring-boot-starter-data-jpa-test"
    testImplementation "org.springframework.boot:spring-boot-starter-flyway-test"
    testImplementation "org.springframework.boot:spring-boot-starter-mail-test"
    testImplementation "org.springframework.boot:spring-boot-starter-restclient-test"
    testImplementation "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test"
    annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation "org.springframework.boot:spring-boot-starter-thymeleaf-test"
    testImplementation "org.springframework.boot:spring-boot-starter-validation-test"
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'org.postgresql:postgresql'

	constraints {
		implementation 'commons-io:commons-io:2.22.0'
	}
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
	}
	dependencies {
		dependency 'org.apache.commons:commons-lang3:3.20.0'
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// Every Testcontainers slice keeps its Spring context cached for the whole run, and the suite
	// now holds enough of them that Gradle's 512m default is exhausted mid-run - the symptom is an
	// OutOfMemoryError while parsing ElimikaApplication in whichever context happens to load last.
	maxHeapSize = '2g'
	// Each fork starts its own shared Postgres (see testsupport.SharedPostgres).
	maxParallelForks = 2
}
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xlint:unchecked", "-Xlint:deprecation"]
}
